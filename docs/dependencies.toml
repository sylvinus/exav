[[vendored]]
path = "crates/exav-core/src/fancy_regex"
upstream = "fancy-regex"
track = "crates"
version = "0.19.2"
kind = "adapted copy"
why = "Backtracking engine for PCRE lookaround, backreferences and atomic groups. Carries two upstream pull requests unreleased when taken (278 and 292, both in 0.20.0) and, of exav's three fixes, only the size analysis overflow is still missing from 0.20.0 (README)."
return_when = "a release has saturating size arithmetic in analyze.rs and compile.rs; the README lists the steps back, checked by cargo test -p exav-core pcre against the crate."

