# What the dependency review reads by hand (docs/DEPENDENCIES.md, "Lifecycle").
# `scripts/deps-review.py` checks it against the manifests and upstream.
#
# - [[pin]]      a `=` requirement or an upper bound: why, and what lets it go.
# - [[patch]]    a `[patch]` entry.
# - [[vendored]] source copied or ported into the tree: where from, which
#                version, and what lets it go back to a dependency (or be dropped).
# - [[switch]]   a default Cargo feature left off (or an optional one turned on)
#                to remove `unsafe` code; scripts/deps-review.py does not read it.
#
# `track` says where the script looks for upstream's newest release: "crates",
# "github" (owner/repo), "pypi", or "none" (a port of a file with no releases).
# `version = "unrecorded"` is a finding: say which upstream version or commit the
# copy was taken from the next time the file is touched. `reviewed` names a later
# upstream release read against the copy with nothing to take from it, so the
# script flags only a release after it; `version` stays the one the copy came
# from, as NOTICE says.

# ---------------------------------------------------------------- pins

[[pin]]
crate = "image"
why = "libclamav 1.5.4 links this version; exav-imagehash reproduces ClamAV's fuzzy image hash bit for bit from its pixels."
until = "ClamAV moves to another release, and the hash parity tests pass on the new decoders."

[[pin]]
crate = "png"
why = "libclamav's version (decoder parity, see image)."
until = "as image."

[[pin]]
crate = "gif"
why = "libclamav's version (decoder parity, see image)."
until = "as image."

[[pin]]
crate = "zune-jpeg"
why = "0.5.15 for JPEG (libclamav's 0.5.8 panics on some damaged files and draws baseline JPEGs with a scan for each component flat; the hashes of other JPEGs are the same, see image_codecs/README.md) and libclamav's 0.4.21 for JPEG inside TIFF (decoder parity, see image)."
until = "0.4.21 as image; 0.5.x is the latest stable."

[[pin]]
crate = "zune-core"
why = "zune-jpeg 0.5.15's companion, named in the code; zune-jpeg 0.4.21's own zune-core is not declared (the vendored tiff decoder reaches it as zune_jpeg_04::zune_core)."
until = "as zune-jpeg."

[[pin]]
crate = "fax"
why = "libclamav's version, for CCITT strips of a TIFF (decoder parity, see image)."
until = "as image."

[[pin]]
crate = "weezl"
why = "0.1.12 where libclamav has 0.1.10: only a debug assertion that a TIFF LZW strip without a clear code tripped is corrected; it decodes the same."
until = "as image."

[[pin]]
crate = "bcdec_rs"
why = "BC1 to BC7 blocks for the viewer's DDS fallback. A 0.x crate pinned with `=` so `cargo install`, which ignores Cargo.lock, builds what was tested."
until = "1.0, or a reason to follow its releases."

[[pin]]
crate = "hayro-jpeg2000"
why = "JPEG 2000, a 0.x crate pinned with `=` so `cargo install` builds what was tested; shared with the PDF text reader."
until = "1.0, or a reason to follow its releases."

[[pin]]
crate = "hayro-jbig2"
why = "JBIG2, as hayro-jpeg2000."
until = "as hayro-jpeg2000."

[[pin]]
crate = "hayro-ccitt"
why = "CCITT fax (a PDF's CCITTFaxDecode, and the TIFF fax that the TIFF decoder does not read), and hayro-jbig2's own MMR decoder, at the version it builds with."
until = "as hayro-jpeg2000."

[[pin]]
crate = "hayro-interpret"
why = "PDF text. Turns on hayro-syntax's `unsafe` feature itself, which is why text-pdf is not a default; pinned with `=` so `cargo install` builds what was tested."
until = "it can be built without that `unsafe` feature (then vendor or patch it, or make text-pdf a default)."

[[pin]]
crate = "hayro-syntax"
why = "as hayro-interpret."
until = "as hayro-interpret."

[[pin]]
crate = "html5gum"
why = "HTML tokens for the shared reader; 0.x, pinned with `=` so `cargo install` builds what was tested."
until = "1.0, or a reason to follow its releases."

[[pin]]
crate = "pulldown-cmark"
why = "Markdown events for the viewer and the scanner's visible text; pinned with `=` so `cargo install` builds what was tested."
until = "a reason to follow its releases."

[[pin]]
crate = "zenjxl-decoder"
why = "JPEG XL for the viewer; the viewer builds a patched copy of this exact version (see [[patch]])."
until = "as the patch."

[[pin]]
crate = "rustdct"
why = "Dev-dependency: the oracle exav-imagehash's src/dct.rs is checked against. It must stay at the version that file was ported from."
until = "dct.rs is ported from a newer rustdct, or the oracle is dropped."

[[pin]]
crate = "wasm-bindgen"
why = "Must equal the version of the wasm-bindgen CLI that generates the glue."
until = "never pinned apart from the CLI: bump both together."

# ---------------------------------------------------------------- switches
#
# `unsafe` counts below are keywords in the macro-expanded source of the locked
# version, for the features that are compiled (scripts/deps-review.py counts
# the text of src/, so its figure for these crates does not change).

[[switch]]
crate = "base64"
version = "0.23.1"
manifests = ["crates/exav-core/Cargo.toml", "crates/exav-unpack/Cargo.toml"]
setting = "default-features = false, features = [\"std\"]: `simd-unsafe` off"
why = "`simd-unsafe` (a default feature) is the only source of `unsafe` in the crate: 8 keywords with it, 0 without (the crate is then `forbid(unsafe_code)`). exav only uses the `GeneralPurpose` engine, never the `Simd` one. ureq and ureq-proto already ask for it off. Holds in the root, fuzz and unpack-wasm locks."
until = "never: nothing in exav needs the SIMD engines."

[[switch]]
crate = "delharc"
version = "0.8.0"
manifests = ["crates/exav-unpack/Cargo.toml"]
setting = "features = [\"no-unsafe-assertions\"]"
why = "Removes the 30 `assert_unchecked` hints (release builds only). 62 `unsafe` keywords before, 32 after in the expanded crate (both counts include 3 macro bodies and a nightly expansion artefact); what is left is bytemuck's derived `unsafe impl`s, a few `from_utf8_unchecked`, `assume_init_mut` and `set_len`. LHA decoding is about 5 to 15 percent slower in a release build (120 MB text as lh5 and as lh7, measured 2026-11-21)."
until = "LHA on exav's own reader (the delharc, chrono and iana-time-zone item in docs/BACKLOG.md)."

[[switch]]
crate = "regex-automata"
version = "0.4.18"
manifests = ["crates/exav-core/Cargo.toml"]
setting = "default-features = false, with every default feature but `dfa` (so `dfa-build`, `dfa-search` and `dfa-onepass` are not asked for)"
why = "All of the crate's `dfa` module `unsafe` is behind `dfa-search`: 53 `unsafe` keywords with it, 26 without (expanded, with meta, hybrid and the NFAs). `regex` turns on only `dfa-onepass`, which has none. Still on in every build that has exav-core's yara feature: bstr's default `unicode` feature enables `dfa-search`, and yara-x-parser takes bstr with its defaults, so the switch does not lower the count until bstr is gone. A build-time copy with `dfa` on also exists for logos-codegen (a proc macro, not linked). No speed change measured on YARA regexps, PCRE subsignatures and wildcard hex signatures over 250 MB (2026-11-21)."
until = "the yara-x-parser vendoring without bstr (docs/BACKLOG.md): then `dfa-search` goes off and the 27 keywords with it."

[[switch]]
crate = "goblin"
version = "0.10.7"
manifests = ["crates/exav-core/Cargo.toml"]
setting = "features = [\"std\", \"pe32\", \"pe64\"]: `elf32` and `elf64` off"
why = "The ELF half of goblin held 90 of its 92 `unsafe` keywords (expanded: 92 with `elf32` and `elf64`, 2 without; the 2 are `Strtab::from_raw`, used by no one). Nothing else in the workspace reads goblin's ELF or Mach-O parts: YARA's `elf` module is the only ELF user and reads through the `elf` crate (next entry)."
until = "PE on exav's own reader (docs/BACKLOG.md): goblin, scroll and plain leave the tree."

[[switch]]
crate = "elf"
version = "0.8.0"
manifests = ["crates/exav-core/Cargo.toml"]
setting = "default-features = false, optional, behind exav-core's `yara` feature: `std`, `alloc` and `to_str` off"
why = "Replaces goblin's ELF half for YARA's `elf` module: the records (header, program and section headers, symbols, dynamic entries, relocations) are decoded by the crate, which is `forbid(unsafe_code)`, has no dependencies, and is MIT or Apache-2.0 (released 2025-05-14). The tables are located by exav's own code (src/yara/modules/elf.rs), as goblin located them: the output is the same on every file goblin parsed, except where goblin gave up on what the module does not expose (names that are not UTF-8, relocation sections, an unreadable hash table) or read a table from offset 0 that the file does not locate. `std` is not needed (only the `ElfStream` reader and error traits), `to_str` only names constants."
until = "never for the YARA module: it reads an in-memory image. exav's own header readers over a ByteSource (`elf_layout`, `elf_image_end` in crates/exav-core/src/pe.rs) stay beside it."

# ---------------------------------------------------------------- patches

[[patch]]
crate = "zenjxl-decoder"
where = "crates/exav-viewer/vendor/zenjxl-decoder"
why = "Instant::now() panics on wasm32-unknown-unknown and the decoder calls it for every frame; and a section's buffer was sized by the length the file declares, about 1 GiB for a file of 34 bytes (upstream's fix ported). crates/exav-viewer/vendor/zenjxl-decoder/EXAV.md lists the differences."
until = "a release reads its clock only when phase timing is asked for and sizes section buffers by the input. Upstream's main branch does both (commits 814994a and 5f1b834, for the unreleased 0.4.0)."

[[patch]]
crate = "zenjxl-decoder-macros"
where = "crates/exav-viewer/vendor/zenjxl-decoder-macros"
why = "Its proc-macro-error2 is unmaintained (RUSTSEC-2026-0173) and cargo reports it as future-incompatible. abort! is a local panicking macro; EXAV.md beside it."
until = "upstream drops proc-macro-error2. Its main branch has (commit 6571342, for the unreleased 0.4.0)."

