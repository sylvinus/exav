# ---------------------------------------------------------------- reviews
#
# One entry per workspace at the end of a late pass, from the last block
# scripts/deps-review.py prints, and one at the end of an early pass, marked
# `pass = "early"`, for the late pass to compare with. `crates` and `unsafe`
# are for the shipped default build (the CLI for the root workspace, the union
# of the wasm modules for the viewer); `*_all` with every feature on. `unsafe`
# counts the keyword in each crate's src/ with comments stripped, so it
# includes code a feature turns off: read it as surface, and compare it with
# the last entry, not with zero.
# The fuzz workspace is not shipped and is not recorded.

[[review]]
workspace = "root"
date = "2026-10-27"
release = "0.0.2"
crates = 143
unsafe = 5110
crates_all = 191
unsafe_all = 7829
twice = 7

[[review]]
workspace = "unpack-wasm"
date = "2026-10-27"
release = "0.0.2"
