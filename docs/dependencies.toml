# What the dependency review reads by hand (docs/DEPENDENCIES.md, "Lifecycle").
# `scripts/deps-review.py` checks it against the manifests and upstream.
#
# - [[pin]]      a `=` requirement: why, and what lets it go.
# - [[patch]]    a `[patch]` entry.
# - [[vendored]] source copied or ported into the tree: where from, which
#                version, and what lets it go back to a dependency (or be dropped).
#
# `track` says where the script looks for upstream's newest release: "crates",
# "github" (owner/repo), "pypi", or "none" (a port of a file with no releases).
# `version = "unrecorded"` is a finding: say which upstream version or commit the
# copy was taken from the next time the file is touched.

# ---------------------------------------------------------------- pins

[[pin]]
crate = "image"
why = "libclamav 1.5.4 links this version; exav-imagehash reproduces ClamAV's fuzzy image hash bit for bit from its pixels."
until = "ClamAV moves to another release, and the hash parity tests pass on the new decoders."

[[pin]]
crate = "png"
why = "libclamav's version (decoder parity, see image)."
until = "as image."

[[pin]]
crate = "gif"
why = "libclamav's version (decoder parity, see image)."
until = "as image."

[[pin]]
crate = "zune-jpeg"
why = "0.5.15 for JPEG (libclamav's 0.5.8 panics on some damaged files and draws baseline JPEGs with a scan for each component flat; the hashes of other JPEGs are the same, see image_codecs/README.md) and libclamav's 0.4.21 for JPEG inside TIFF (decoder parity, see image)."
until = "0.4.21 as image; 0.5.x is the latest stable."

[[pin]]
crate = "zune-core"
why = "zune-jpeg 0.5.15's companion, named in the code; zune-jpeg 0.4.21's own zune-core is not declared (the vendored tiff decoder reaches it as zune_jpeg_04::zune_core)."
until = "as zune-jpeg."

[[pin]]
crate = "fax"
why = "libclamav's version, for CCITT strips of a TIFF (decoder parity, see image)."
until = "as image."

[[pin]]
crate = "weezl"
why = "0.1.12 where libclamav has 0.1.10: only a debug assertion that a TIFF LZW strip without a clear code tripped is corrected; it decodes the same."
until = "as image."

[[pin]]
crate = "bcdec_rs"
why = "BC1 to BC7 blocks for the viewer's DDS fallback. A 0.x crate pinned with `=` so `cargo install`, which ignores Cargo.lock, builds what was tested."
until = "1.0, or a reason to follow its releases."

[[pin]]
crate = "hayro-jpeg2000"
why = "JPEG 2000, a 0.x crate pinned with `=` so `cargo install` builds what was tested; shared with the PDF text reader."
until = "1.0, or a reason to follow its releases."

[[pin]]
crate = "hayro-jbig2"
why = "JBIG2, as hayro-jpeg2000."
until = "as hayro-jpeg2000."

[[pin]]
crate = "hayro-ccitt"
why = "hayro-jbig2's own MMR decoder, at the version it builds with."
until = "as hayro-jpeg2000."

[[pin]]
crate = "hayro-interpret"
why = "PDF text. Turns on hayro-syntax's `unsafe` feature itself, which is why text-pdf is not a default; pinned with `=` so `cargo install` builds what was tested."
until = "it can be built without that `unsafe` feature (then vendor or patch it, or make text-pdf a default)."

[[pin]]
crate = "hayro-syntax"
why = "as hayro-interpret."
until = "as hayro-interpret."

[[pin]]
crate = "html5gum"
why = "HTML tokens for the shared reader; 0.x, pinned with `=` so `cargo install` builds what was tested."
until = "1.0, or a reason to follow its releases."

[[pin]]
crate = "pulldown-cmark"
why = "Markdown events for the viewer and the scanner's visible text; pinned with `=` so `cargo install` builds what was tested."
until = "a reason to follow its releases."

[[pin]]
crate = "zenjxl-decoder"
why = "JPEG XL for the viewer; the viewer builds a patched copy of this exact version (see [[patch]])."
until = "as the patch."

[[pin]]
crate = "rustdct"
why = "Dev-dependency: the oracle exav-imagehash's src/dct.rs is checked against. It must stay at the version that file was ported from."
until = "dct.rs is ported from a newer rustdct, or the oracle is dropped."

[[pin]]
crate = "wasm-bindgen"
why = "Must equal the version of the wasm-bindgen CLI that generates the glue."
until = "never pinned apart from the CLI: bump both together."

# ---------------------------------------------------------------- patches

[[patch]]
crate = "zenjxl-decoder"
where = "crates/exav-viewer/vendor/zenjxl-decoder"
why = "Instant::now() panics on wasm32-unknown-unknown and the decoder calls it for every frame. crates/exav-viewer/vendor/zenjxl-decoder/EXAV.md lists the differences."
until = "upstream reads its clock only when phase timing is asked for, or takes the patch."

[[patch]]
crate = "zenjxl-decoder-macros"
where = "crates/exav-viewer/vendor/zenjxl-decoder-macros"
why = "Its proc-macro-error2 is unmaintained (RUSTSEC-2026-0173) and cargo reports it as future-incompatible. abort! is a local panicking macro; EXAV.md beside it."
until = "upstream drops proc-macro-error2."

