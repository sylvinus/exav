# Tag-driven binary releases. Push a tag like `v0.1.0` and this cross-compiles
# the `exav` CLI and the standalone `exav-unpack`, `exav-grep`, `exav-pe-emu`,
# `exav-imagehash` and `exav-qr` for each target, archives each with LICENSE
# and NOTICE, and attaches them to the GitHub Release for that tag. Static musl
# Linux builds run on any distro (no glibc).
# The `wasm` job adds the WebAssembly artifacts: the npm tarballs of the
# unpacker (`@exav/unpack-wasm`, standard preset) and the viewer
# (`@exav/viewer`), and the engine as a WASI module (`exav-core --features
# wasi-bin`, same command CI's `wasm` job builds). The npm packages are
# published from these tarballs (docs/RELEASING.md), so that npm and the
# release carry the same bytes.
#
# Every build maps the checkout and the cargo home to fixed names
# (scripts/build-flags.sh), and scripts/check-build-paths.py refuses to upload
# an archive, tarball or module that holds a path of the runner.
#
# For a fancier setup (a `curl | sh` installer + auto-generated Homebrew
# formula), migrate to `dist` (https://opensource.axo.dev/cargo-dist/) later;
# this hand-rolled workflow is the transparent baseline.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create/upload to the Release

jobs:
  # `upload-rust-binary-action` uploads into a Release but never creates one,
  # so without this every asset job fails with `release not found` (retry loop,
  # then exit 1). This creates it from the tag if missing; on a re-run it does nothing.
  create-release:
    runs-on: ubuntu-latest
    steps:
      # The action reads the tag and CHANGELOG.md from a checkout: without one
      # it fails with `not a git repository`.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Everything a release publishes is labelled with a version of its own:
      # the binaries with the workspace's, the npm packages with theirs. One
      # that was not bumped ships next to the others under another number, and
      # nothing else fails. Checked before anything is built.
      - name: Check every version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -1)
          VIEWER=$(node -p "require('./crates/exav-viewer/package.json').version")
          UNPACK=$(node -p "require('./crates/exav-unpack-wasm/package.json').version")
          status=0
          for pair in "Cargo.toml:$WORKSPACE" "crates/exav-viewer/package.json:$VIEWER" "crates/exav-unpack-wasm/package.json:$UNPACK"; do
            file="${pair%%:*}"; version="${pair#*:}"
            [ "$version" = "$TAG_VERSION" ] || { echo "$file is $version, the tag is $TAG_VERSION"; status=1; }
          done
          exit $status
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # The release notes are this tag's section of the changelog
          # (`## [0.0.2] - 2026-10-11`); without it the body is empty.
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The checkout, the cargo home and the rustup home are mapped to fixed
      # names in everything built below (cross passes RUSTFLAGS to its
      # container), so that no binary holds a path of the runner.
      - name: Map build paths to fixed names
        shell: bash
        run: echo "RUSTFLAGS=$(scripts/build-flags.sh)" >> "$GITHUB_ENV"
      # The six builds once without uploading, then the gate, then the same six
      # with the upload (cargo finds the build fresh and only archives it
      # again): nothing is uploaded that holds a path of the runner.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav
          target: ${{ matrix.target }}
          archive: exav-$tag-$target
          include: LICENSE,NOTICE
          dry-run: true
          dry-run-intended: true
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-unpack
          target: ${{ matrix.target }}
          archive: exav-unpack-$tag-$target
          include: LICENSE,NOTICE
          dry-run: true
          dry-run-intended: true
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-grep
          target: ${{ matrix.target }}
          archive: exav-grep-$tag-$target
          include: LICENSE,NOTICE
          dry-run: true
          dry-run-intended: true
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-qr
          features: qr
          target: ${{ matrix.target }}
          archive: exav-qr-$tag-$target
          include: LICENSE,NOTICE
          dry-run: true
          dry-run-intended: true
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-pe-emu
          target: ${{ matrix.target }}
          archive: exav-pe-emu-$tag-$target
          include: LICENSE,NOTICE
          dry-run: true
          dry-run-intended: true
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-imagehash
          target: ${{ matrix.target }}
          archive: exav-imagehash-$tag-$target
          include: LICENSE,NOTICE
          dry-run: true
          dry-run-intended: true
      - name: Refuse a build path in any archive
        shell: bash
        run: |
          shopt -s nullglob
          files=(exav*-"$GITHUB_REF_NAME"-*.tar.gz exav*-"$GITHUB_REF_NAME"-*.zip)
          [ "${#files[@]}" = 6 ] || { echo "expected 6 archives, found ${#files[@]}: ${files[*]}"; exit 1; }
          python -I scripts/check-build-paths.py "${files[@]}"
      # Builds the `exav` binary, cross-compiling musl targets
      # via `cross` as needed, archives it as `exav-<target>.tar.gz`/`.zip`, and
      # uploads it to the Release for the pushed tag.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav
          target: ${{ matrix.target }}
          archive: exav-$tag-$target
          # YARA rule support is on by default; keep it for full parity.
          # For a smaller binary, add: features: "" / no-default-features.
          # The licenses of everything linked go with every binary (NOTICE).
          include: LICENSE,NOTICE
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
      # The standalone tools, each in an archive of its own: most people
      # want one of them, not the scanner.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-unpack
          target: ${{ matrix.target }}
          archive: exav-unpack-$tag-$target
          include: LICENSE,NOTICE
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-grep
          target: ${{ matrix.target }}
          archive: exav-grep-$tag-$target
          include: LICENSE,NOTICE
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
      # In the exav-grep package, behind its `qr` feature.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-qr
          features: qr
          target: ${{ matrix.target }}
          archive: exav-qr-$tag-$target
          include: LICENSE,NOTICE
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-pe-emu
          target: ${{ matrix.target }}
          archive: exav-pe-emu-$tag-$target
          include: LICENSE,NOTICE
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exav-imagehash
          target: ${{ matrix.target }}
          archive: exav-imagehash-$tag-$target
          include: LICENSE,NOTICE
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256

  # WebAssembly artifacts for the Release: engine (WASI) + unpacker (npm).
  wasm:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      # Prebuilt wasm-pack: compiling it from source costs ~6 minutes, and
      # this is the same trusted author as the other taiki-e actions here.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # The tarball embeds package.json's version, not the tag: fail fast with
      # a clear message if it wasn't bumped, instead of shipping a mislabeled
      # artifact next to correctly-labeled native ones.
      - name: Check npm version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [ "$PKG_VERSION" = "$TAG_VERSION" ] || { echo "package.json ($PKG_VERSION) != tag ($TAG_VERSION)"; exit 1; }
        working-directory: crates/exav-unpack-wasm
      - name: Map build paths to fixed names
        run: echo "RUSTFLAGS=$(scripts/build-flags.sh)" >> "$GITHUB_ENV"
      - name: Build unpacker wasm (standard preset, as published to npm)
        run: npm run build
        working-directory: crates/exav-unpack-wasm
      - name: Pack the unpacker's npm tarball
        run: npm run prepublishOnly && npm pack
        working-directory: crates/exav-unpack-wasm
      - name: Build engine WASI module
        run: cargo build --release --target wasm32-wasip1 -p exav-core --features wasi-bin
      # The viewer: its wasm modules (the wasm-bindgen-cli its Cargo.toml pins,
      # which build-wasm.sh checks; wasm-opt from binaryen, as CI), then the
      # package on top of the unpacker's pkg/ built above.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the viewer
        run: |
          npm ci
          npm run build:wasm
          npm run build
        working-directory: crates/exav-viewer
      - name: Pack the viewer's npm tarball
        run: npm run prepublishOnly && npm pack
        working-directory: crates/exav-viewer
      # The viewer ships three wasm parsers of @silurus/ooxml as that project
      # built them (on a GitHub runner), and pdf.js's worker names a virtual
      # /home/web_user: not our builds, not a path of this runner.
      - name: Refuse a build path in any upload
        run: |
          cp target/wasm32-wasip1/release/exav-wasm.wasm "exav-wasm-$GITHUB_REF_NAME-wasm32-wasip1.wasm"
          python3 -I scripts/check-build-paths.py \
            --except /docx_parser_bg.wasm --except /pptx_parser_bg.wasm --except /xlsx_parser_bg.wasm --except /pdfjs.worker.js \
            crates/exav-unpack-wasm/*.tgz crates/exav-viewer/*.tgz "exav-wasm-$GITHUB_REF_NAME-wasm32-wasip1.wasm"
      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `npm pack` names the tarballs from package.json (checked above for
        # the unpacker, by the first job for both), the WASI module is named
        # after the tag like the native `exav-$tag-$target` archives.
        # `--clobber` makes re-runs idempotent.
        run: gh release upload "$GITHUB_REF_NAME" --clobber crates/exav-unpack-wasm/*.tgz crates/exav-viewer/*.tgz "exav-wasm-$GITHUB_REF_NAME-wasm32-wasip1.wasm"
