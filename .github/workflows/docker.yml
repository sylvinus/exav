# Build, smoke-test, and (on version tags) publish the container image.
#
# `build-test` runs on every push/PR: it builds the image and exercises the
# clamd-compatible daemon end-to-end (PING + an EICAR INSTREAM scan) so a broken
# image can't merge. On `v*` tags, `binaries` cross-compiles the static musl
# binaries natively on amd64 (via `cross`, NOT under QEMU) and `publish`
# assembles the multi-arch image around them with `COPY` — compiling the
# Rust+ring tree emulated for arm64 is what used to make publishing slow.
# `publish` then re-checks the pushed tag, because the image must carry Docker
# (not OCI) mediatypes for podman to honour its HEALTHCHECK; see that step.
# Pull with:
#   docker run -d -p 3310:3310 -v exav-db:/var/lib/exav ghcr.io/sylvinus/exav
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64, load into docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: exav:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the clamd-compatible daemon
        run: |
          # Empty volume + no mirror (no EXAV_SIG_SOURCES/EXAV_DB_URL = nothing
          # to fetch): explicitly opt into serving the built-in EICAR-only
          # baseline (--allow-no-db — refused by default) and skip the wait for a
          # sidecar that is not coming, so CI is fast.
          docker run -d --name exav -p 3310:3310 \
            -e EXAV_STARTUP_WAIT_SECS=0 -e EXAV_ALLOW_NO_DB=1 exav:ci
          if ! python3 .github/docker-smoke.py 127.0.0.1 3310; then
            docker logs exav
            exit 1
          fi
          docker logs exav
          # The image's HEALTHCHECK is on the container, and its command works.
          # Not `docker inspect .State.Health`: the first probe is 30s away.
          HC=$(docker inspect --format '{{json .Config.Healthcheck.Test}}' exav)
          echo "healthcheck: $HC"
          [ "$HC" = '["CMD","/exav","--ping"]' ]
          docker exec exav /exav --ping
          docker rm -f exav

  # Static musl binaries for the published image, cross-compiled natively on
  # amd64 via `cross` (real cross toolchains in containers — the same mechanism
  # the `release` workflow already uses for its musl legs). Tag-only: ordinary
  # pushes/PRs only need `build-test` above.
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked
      # Same flags the Dockerfile compiles with, so the two image paths stay
      # one build apart: updater (`http`) on, everything else default.
      - name: Cross-compile static musl binary
        run: cross build --release -p exav --features http --target ${{ matrix.target }}
      - name: Stage and strip per-arch binary
        run: |
          mkdir -p bins
          cp "target/${{ matrix.target }}/release/exav" "bins/exav-${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip "bins/exav-${{ matrix.arch }}"
          else
            strip "bins/exav-${{ matrix.arch }}"
          fi
      - name: Upload per-arch binary
        uses: actions/upload-artifact@v4
        with:
          name: exav-docker-${{ matrix.arch }}
          path: bins/exav-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [build-test, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      # No QEMU anywhere in this job: each platform build only COPYs its
      # prebuilt binary (plus mkdir/chown, pinned to the build machine in the
      # Dockerfile), so there is nothing to emulate.
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          pattern: exav-docker-*
          path: bins
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/exav
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Take bins/exav-$TARGETARCH from the `binaries` job instead of
          # compiling in-image (Dockerfile documents both branches).
          build-args: BIN_SOURCE=prebuilt
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Publish Docker manifest-list/schema2 mediatypes rather than OCI
          # ones, so that podman honours the image's HEALTHCHECK.
          #
          # `Healthcheck` is a Docker config extension with no equivalent in
          # the OCI image spec. Nothing strips it: flipping this exporter
          # option leaves the config blob byte-identical (same sha256), and
          # only the declared mediatype changes. But podman reads the field
          # back solely from a schema2 config — containers/common fills
          # `HealthCheck` in the `DockerV2Schema2MediaType` branch of
          # libimage/inspect.go and in no other branch — so under OCI
          # mediatypes it reports "has no defined healthcheck" however healthy
          # the daemon actually is. That leaves a rootless podman deployment
          # with no readiness signal at all: the image is distroless, so a
          # compose-level `test:` has no shell to run in either. Docker reads
          # the field from both configs, so this is a no-op for `docker run`.
          #
          # `provenance: false` is load-bearing, not tidying: attestations can
          # only be referenced from an OCI index, so buildx's default
          # provenance attestation would force OCI mediatypes straight back.
          # Attaching SLSA provenance as a separate referrer instead (e.g.
          # actions/attest-build-provenance with push-to-registry) leaves the
          # image's own mediatype alone.
          #
          # `push` moves into `outputs` so there is a single image exporter
          # making a single mediatype decision.
          provenance: false
          outputs: type=image,oci-mediatypes=false,push=true

      # The `build-test` job above smoke-tests a locally `load`ed image, which
      # cannot catch a *push-time* mediatype change — the exporter is what
      # differs. These two steps therefore run against the pushed tag.
      - name: Assert the published manifest is a Docker manifest list
        env:
          # Via env: rather than inlined into `run:`, so a tag reaches bash as
          # data and not as code.
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED: application/vnd.docker.distribution.manifest.list.v2+json
        run: |
          set -euo pipefail
          # The tags are already public when this runs: a failure here is an
          # alarm to fix and re-publish, not a gate.
          bad=0
          while read -r TAG; do
            [ -n "$TAG" ] || continue
            GOT=$(docker buildx imagetools inspect "$TAG" --raw | jq -r '.mediaType')
            echo "$TAG -> $GOT"
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::$TAG is already published as $GOT, expected $EXPECTED -- podman will ignore the image HEALTHCHECK"
              bad=1
            fi
          done <<<"$TAGS"
          exit "$bad"

      # The assertion above pins the wire format; this one tests the consumer
      # that the format exists for. podman is preinstalled on ubuntu-latest.
      - name: Verify podman sees the HEALTHCHECK on the published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(printf '%s\n' "$TAGS" | head -1)
          podman --version
          # Log in rather than relying on an anonymous pull: a GHCR package
          # starts out private, so the very first publish of a fork would
          # otherwise fail here for the wrong reason.
          podman login ghcr.io -u "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_PASSWORD"
          podman pull -q "$TAG"

          # This coming back empty *is* the regression being guarded against:
          # podman populates it only from a Docker schema2 config.
          IMAGE_HC=$(podman image inspect \
            --format '{{if .HealthCheck}}{{.HealthCheck.Test}}{{end}}' "$TAG")
          echo "image healthcheck: ${IMAGE_HC:-<absent>}"
          if [ -z "$IMAGE_HC" ]; then
            echo "::error::podman reports no healthcheck on $TAG"
            exit 1
          fi

          # Same env as the `build-test` smoke test: no mirror configured, so
          # opt into the built-in EICAR-only baseline and skip the wait for a
          # sidecar that is not coming.
          podman run -d --name exav-podman \
            -e EXAV_STARTUP_WAIT_SECS=0 -e EXAV_ALLOW_NO_DB=1 "$TAG"
          CONTAINER_HC=$(podman inspect \
            --format '{{if .Config.Healthcheck}}{{.Config.Healthcheck.Test}}{{end}}' exav-podman)
          echo "container healthcheck: ${CONTAINER_HC:-<absent>}"
          if [ -z "$CONTAINER_HC" ]; then
            echo "::error::healthcheck did not reach the container config"
            podman rm -f exav-podman
            exit 1
          fi

          # `/exav --ping` answers only once the database is loaded, so poll
          # instead of asserting on the first probe.
          for _ in $(seq 60); do
            if podman healthcheck run exav-podman; then
              echo "podman reports: $(podman inspect --format '{{.State.Health.Status}}' exav-podman)"
              podman rm -f exav-podman
              exit 0
            fi
            sleep 1
          done
          echo "::error::podman healthcheck never passed"
          podman logs exav-podman
          podman rm -f exav-podman
          exit 1
