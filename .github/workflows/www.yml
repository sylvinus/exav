# Builds the website and the viewer demo, and deploys them to GitHub Pages.
name: Deploy site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "www"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build with Astro
        run: |
          npx --no-install astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}
      # The @exav/viewer demo, served at /viewer/demo/: the package and its wasm
      # modules built from this commit, the archive engine's pkg/ too.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/exav-viewer
            crates/exav-unpack-wasm
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129,wasm-pack
      - name: Build the viewer demo
        run: |
          (cd crates/exav-unpack-wasm && wasm-pack build --release --target web)
          cd crates/exav-viewer
          npm ci
          npm run build:wasm
          npm run build
          # The sidebar's files: github.com/sylvinus/exav-samples, HEAD.
          npm run demo:showcase
          # DEMO_ORIGIN goes into the sandboxed frame's policy, for Safari.
          DEMO_BASE="${{ steps.pages.outputs.base_path }}/viewer/demo/" DEMO_ORIGIN="${{ steps.pages.outputs.origin }}" npm run demo:build
          # dist/viewer/ holds the File viewer docs; the demo must not land on them.
          test ! -e "$GITHUB_WORKSPACE/${{ env.BUILD_PATH }}/dist/viewer/demo"
          cp -R demo/dist "$GITHUB_WORKSPACE/${{ env.BUILD_PATH }}/dist/viewer/demo"
          test -f "$GITHUB_WORKSPACE/${{ env.BUILD_PATH }}/dist/viewer/demo/index.html"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
