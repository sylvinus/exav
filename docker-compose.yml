# Keeping exav's signatures fresh in Docker. exav bundles no database and no
# mirror URL, so you choose the source. Three options:
#
#  1. Prebaked/managed volume: mount a `/var/lib/exav` you populate yourself
#     with `cvd`/`freshclam`. Just the `exav` service below, no updater.
#
#  2. Built-in auto-update: set EXAV_SIG_SOURCES on the `exav` service to one
#     or more sources you trust (comma-separated): a CVD mirror base ends in `/`
#     and expands to main/daily/bytecode.cvd, any other http(s) URL is fetched
#     verbatim, and anything else is a file of either. It fetches on start and
#     every EXAV_UPDATE_INTERVAL_SECS after that. No sidecar needed; delete the
#     `updater` service.
#
#  3. Sidecar (shown as the default): a second container writes the shared
#     volume and the scanner hot-reloads it. Here the sidecar is the same image
#     with `--auto-update` and nothing to listen on, which fetches and nothing
#     else. You could instead run the official `clamav/clamav` freshclam
#     container as the sidecar; its NotifyClamd RELOAD is protocol-compatible
#     with exav's daemon.
#
# Run with:  EXAV_SIG_SOURCES=https://clamav-mirror.internal/ docker compose up -d
#
# The source is a mirror you run (`cvdupdate serve`, or any web server over a
# `cvdupdate` directory). Cisco's database.clamav.net serves only freshclam and
# cvdupdate, and blocks other clients.

# Both containers run as the image's non-root user with a read-only root
# filesystem, no capabilities and no privilege escalation. A new named volume
# mounted at a path the image owns starts out owned by 65532. To reuse a volume
# a root process filled, see "A volume that root filled" in the Docker guide.
x-hardening: &hardening
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  exav:
    <<: *hardening
    image: ghcr.io/sylvinus/exav:latest
    ports:
      # clamd-compatible; `clamdscan --stream` over TCP works. Published on
      # localhost only: the clamd protocol has no authentication.
      - "127.0.0.1:3310:3310"
    volumes:
      - exav-db:/var/lib/exav
      # Where an object larger than the spill threshold (16M) waits while it is
      # scanned; the root filesystem is read-only. Each file is unlinked as soon
      # as it is created. To keep them off disk, replace this line with
      # `tmpfs: ["/tmp:size=4g"]` on the service: a tmpfs counts against the
      # container's memory, so size it as the Docker guide's --read-only
      # section says.
      - exav-spill:/tmp
    # The image's HEALTHCHECK, said here too: podman ignores it on an image
    # that does not carry Docker mediatypes (older tags, or a registry that
    # re-exports as OCI).
    healthcheck:
      test: ["CMD", "/exav", "--ping"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  updater:
    <<: *hardening
    image: ghcr.io/sylvinus/exav:latest
    # Fetch into the shared volume and nothing else. "Updater" is not a flag:
    # it is --auto-update with no listener, so the two halves cannot disagree.
    command: ["--auto-update", "--update-interval-secs", "43200"]
    environment:
      # The image's ENV names a clamd listener; empty removes it, which a
      # container runtime can do and unsetting cannot.
      EXAV_LISTEN: ""
      EXAV_SIG_SOURCES: "${EXAV_SIG_SOURCES:?set EXAV_SIG_SOURCES to one or more signature sources you trust; a CVD mirror base ends in /}"
    volumes:
      - exav-db:/var/lib/exav
    # The image's health check pings a listener, and this container has none.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  exav-db:
  exav-spill:
