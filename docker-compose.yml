# Keeping exav's signatures fresh in Docker. exav bundles no database and no
# mirror URL, so you choose the source. Three options:
#
#  1. Prebaked/managed volume — mount a `/var/lib/exav` you populate yourself
#     with `cvd`/`freshclam`. Just the `exav` service below, no updater.
#
#  2. Built-in auto-update — set EXAV_SIG_SOURCES on the `exav` service to one
#     or more sources you trust (comma-separated): a CVD mirror base ends in `/`
#     and expands to main/daily/bytecode.cvd, any other http(s) URL is fetched
#     verbatim, and anything else is a file of either. It fetches on start and
#     every EXAV_UPDATE_INTERVAL_SECS after that. No sidecar needed; delete the
#     `updater` service.
#
#  3. Sidecar (shown as the default) — a second container writes the shared
#     volume and the scanner hot-reloads it. Here the sidecar is the same image
#     with `--auto-update` and nothing to listen on, which fetches and nothing
#     else. You could instead run the official `clamav/clamav` freshclam
#     container as the sidecar; its NotifyClamd RELOAD is protocol-compatible
#     with exav's daemon.
#
# Run with:  EXAV_SIG_SOURCES=https://your-mirror/ docker compose up -d

services:
  exav:
    image: ghcr.io/sylvinus/exav:latest
    ports:
      - "3310:3310" # clamd-compatible; `clamdscan --stream` over TCP works
    volumes:
      - exav-db:/var/lib/exav
    restart: unless-stopped

  updater:
    image: ghcr.io/sylvinus/exav:latest
    # Fetch into the shared volume and nothing else. "Updater" is not a flag:
    # it is --auto-update with no listener, so the two halves cannot disagree.
    command: ["--auto-update", "--update-interval-secs", "43200"]
    environment:
      # The image's ENV names a clamd listener; empty removes it, which a
      # container runtime can do and unsetting cannot.
      EXAV_LISTEN: ""
      EXAV_SIG_SOURCES: "${EXAV_SIG_SOURCES:?set EXAV_SIG_SOURCES to one or more signature sources you trust — a CVD mirror base ends in /}"
    volumes:
      - exav-db:/var/lib/exav
    restart: unless-stopped

volumes:
  exav-db:
