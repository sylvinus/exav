[package]
name = "exav-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["wasm", "filesystem"]
readme = "README.md"
description = "WASM-compiled scanning core for exav: compile to wasm32-wasip1 and run inside a WASM runtime (wasmi/wasmtime) for sandboxed malware scanning."

[[bin]]
name = "exav_wasm"
path = "src/main.rs"

# YARA is intentionally omitted (no wasmtime-in-wasm); formats forward to
# exav-core. `all-formats` is the default; build with `--no-default-features
# --features zip` (etc.) for a smaller module.
[features]
default = ["all-formats", "decrypt"]
all-formats = ["exav-core/all-formats"]
checksums = ["exav-core/checksums"]
decrypt = ["exav-core/decrypt"]
zip = ["exav-core/zip"]
gzip = ["exav-core/gzip"]
tar = ["exav-core/tar"]
bzip2 = ["exav-core/bzip2"]
xz = ["exav-core/xz"]
zstd = ["exav-core/zstd"]
lzip = ["exav-core/lzip"]
cab = ["exav-core/cab"]
sevenz = ["exav-core/sevenz"]
rar = ["exav-core/rar"]
arj = ["exav-core/arj"]
lha = ["exav-core/lha"]
iso = ["exav-core/iso"]
ole = ["exav-core/ole"]
pdf = ["exav-core/pdf"]
email = ["exav-core/email"]
dmg = ["exav-core/dmg"]
upx = ["exav-core/upx"]
ar = ["exav-core/ar"]
cpio = ["exav-core/cpio"]
xar = ["exav-core/xar"]

[dependencies]
exav-core = { path = "../exav-core", version = "0.1.0", default-features = false }
serde_json = "1.0.140"
