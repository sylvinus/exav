<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The policy the viewer's documentation recommends; the browser tests fail on any violation.
         `worker-src blob:` and `style-src 'unsafe-inline'` are for the Office engine only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="description" content="@exav/viewer: PDF, DWG, DXF, Office, IFC, TIFF and archives, viewed in the browser. Nothing is uploaded." />
    <title>exav viewer demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
