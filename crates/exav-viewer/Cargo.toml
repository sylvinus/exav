# Excluded from the workspace (a wasm32-target artifact, with its own lock and
# target directory), so values are explicit.
[package]
name = "exav-viewer"
version = "0.0.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/sylvinus/exav"
rust-version = "1.95"
description = "The WebAssembly half of @exav/viewer: exav-render's image decoders, DWG/DXF engine and IFC/STL meshes for the browser."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Eleven modules are built from this crate, one per feature, so that a page
# downloads only the engine of what it opens (`scripts/build-wasm.sh`).
[features]
default = []
# exav-render's image decoders, for the formats browsers do not draw.
image = ["exav-render/image", "exav-render/webp", "exav-render/ico", "exav-render/pnm", "exav-render/qoi", "exav-render/dds", "exav-render/ff", "exav-render/hdr", "exav-render/jp2", "exav-render/jbig2", "exav-render/jxl", "exav-render/raw"]
# DWG and DXF, parsed and tessellated.
dwg = ["exav-render/dwg"]
# IFC, STL, OBJ, PLY and glTF models, meshed.
model = ["exav-render/ifc", "exav-render/stl", "exav-render/obj", "exav-render/ply", "exav-render/gltf"]
# Markdown, read into a tree of blocks and inlines; JSON and XML indented and a
# diff's lines marked; and how a file's bytes are read as text by exav-unpack's
# rule (encoding and binary check; the page decodes).
text = ["exav-render/markdown", "exav-render/text-view", "dep:exav-unpack", "exav-unpack/text"]
# XLS, ODS, FODS and Numbers, converted to XLSX for the spreadsheet engine.
sheets = ["exav-render/office-sheets"]
# PPT, ODP, FODP and Keynote, converted to PPTX for the presentation engine.
slides = ["exav-render/office-slides"]
# CSV and TSV, converted to XLSX for the spreadsheet engine (the reader of the
# encoding and the separator, and the XLSX writer, none of the workbook readers).
table = ["exav-render/office-csv"]
# DOC, ODT, FODT and RTF, converted to DOCX for the document engine (opt-in:
# `converter: "exav"`).
docs = ["exav-render/office-docs"]
# pdf.js's JPXDecode decoder, in place of OpenJPEG (openjpeg_nowasm_fallback.js).
pdf-jpx = ["exav-render/jp2"]
# pdf.js's JBIG2Decode and CCITTFaxDecode decoder, in place of PDFium's
# (jbig2_nowasm_fallback.js). One module, as pdf.js loads one for both.
pdf-jbig2 = ["exav-render/jbig2", "exav-render/ccitt"]
# What a file is, from its first bytes, by exav's own detection (exav-unpack's
# for containers, PDF, RTF, DXF and DWG, exav-render's for images and for the
# PLY, GLB and IFC models; only the detectors are reached, the readers and
# decoders are not linked), and a ZIP's
# central directory, read by exav-unpack's ZIP reader from the last bytes of
# the file, for the Office page and for the limits on a ZIP's directory; and
# which Office formats a compound file, a ZIP or a PowerPoint 2 to 4 file is
# (exav-unpack's compound file reader and BinHex header).
sniff = [
    "dep:exav-unpack", "exav-unpack/zip", "exav-unpack/text", "exav-unpack/chm",
    "exav-unpack/tnef", "exav-unpack/rtf", "exav-unpack/dxf", "exav-unpack/dwg", "exav-unpack/iso",
    "exav-unpack/arc", "exav-unpack/ole", "exav-unpack/binhex",
    "exav-render/ifc", "exav-render/ply", "exav-render/gltf",
    "exav-render/image", "exav-render/webp", "exav-render/ico", "exav-render/pnm", "exav-render/qoi", "exav-render/dds", "exav-render/ff", "exav-render/hdr", "exav-render/jp2", "exav-render/jbig2", "exav-render/jxl", "exav-render/raw",
]

[dependencies]
exav-render = { path = "../exav-render", version = "0.0.3", default-features = false }
exav-unpack = { path = "../exav-unpack", version = "0.0.3", default-features = false, optional = true }
wasm-bindgen = "=0.2.129"

# The compound files of the sniff module's tests.
[dev-dependencies]
exav-unpack = { path = "../exav-unpack", version = "0.0.3", default-features = false, features = ["test-util"] }

# zenjxl-decoder reads `std::time::Instant` for every frame, which panics on
# this target: the copy here reads a clock that says zero there, and is the
# published 0.3.10 in everything else (vendor/zenjxl-decoder/EXAV.md). Its
# macros crate is copied without `proc-macro-error2`, which is unmaintained
# (vendor/zenjxl-decoder-macros/EXAV.md).
[patch.crates-io]
zenjxl-decoder = { path = "vendor/zenjxl-decoder" }
zenjxl-decoder-macros = { path = "vendor/zenjxl-decoder-macros" }

# Size-optimised: this crate ships as `.wasm`.
#
# `wasm32-unknown-unknown` is a `panic = "abort"` target, so a panic traps the
# instance and every later call into it fails. The worker that hosts each
# module replaces it and fails the requests it had.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
