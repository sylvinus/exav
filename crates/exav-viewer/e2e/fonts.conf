<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The system's configuration, with greyscale antialiasing (playwright.config.ts).
  Subpixel antialiasing, which GitHub's Ubuntu runner has, gives text coloured
  fringes the pixel tests take for the colour they look for, and thins small
  glyphs below their ink threshold.

  The generic families are the ones Chromium picks by itself (Times New Roman,
  Arial, Courier New, which fontconfig maps to the Liberation fonts): Firefox
  and WebKit ask fontconfig for a bare `serif`, which is DejaVu Serif here, a
  third wider, and the pixel tests expect Chromium's text.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
