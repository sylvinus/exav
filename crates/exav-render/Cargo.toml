[package]
name = "exav-render"
description = "Memory-safe decoders that turn files into something to draw: images into pixels, DWG and DXF drawings and IFC, STL, OBJ, PLY and glTF models into GPU-ready geometry, and office documents (spreadsheets, presentations, text documents) into XLSX, PPTX and DOCX."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["image", "dwg", "ifc", "office", "cad"]
categories = ["multimedia::images", "rendering::data-formats"]
readme = "README.md"
# The stroke font the build script compiles in, and the licences and notices.
include = ["src/**/*", "fonts/**/*", "build.rs", "README.md", "LICENSE", "NOTICE"]

# The vendored `tiff` decoder's doc examples are written for it as a crate of
# its own: here their `use tiff::...` cannot resolve.
[lib]
doctest = false

[dependencies]
# The decoders are at the versions libclamav 1.5.4 links, so that exav-imagehash
# reproduces ClamAV's hash bit for bit. JPEG and TIFF are not `image` features:
# they go through `src/image_codecs/`, `image`'s own decoders over zune-jpeg
# built without its SIMD code (its only `unsafe`), which `image` and `tiff`
# cannot turn off. Pinned with `=` for `cargo install`, which resolves without
# Cargo.lock.
image = { version = "=0.25.9", default-features = false, features = ["png", "gif", "bmp"], optional = true }
png = { version = "=0.18.0", optional = true }
gif = { version = "=0.14.1", optional = true }
zune-jpeg = { version = "=0.5.8", default-features = false, features = ["std"], optional = true }
zune-core = { version = "=0.5.0", optional = true }
zune-core-04 = { package = "zune-core", version = "=0.4.12", optional = true }
# The vendored `tiff` decoder's dependencies, as tiff 0.10.3 has them less
# `half`, and `bytemuck` for its byte casts.
zune-jpeg-04 = { package = "zune-jpeg", version = "=0.4.21", default-features = false, features = ["std"], optional = true }
fax34 = { package = "fax", version = "=0.2.6", optional = true }
flate2 = { version = "1.1.10", optional = true }
quick-error = { version = "2.0.1", optional = true }
# Also `gif`'s LZW. 0.1.12, not libclamav's 0.1.10: it only corrects a debug
# assertion that a TIFF stream without a clear code tripped; it decodes the same.
weezl = { version = "=0.1.12", optional = true }
bytemuck = { version = "1", optional = true }
# Zstandard strips and tiles of a TIFF, for the viewer's `decode_any` only (as
# exav-unpack reads them, same version).
ruzstd = { version = "0.9.1", default-features = false, features = ["std"], optional = true }
# LZMA strips and tiles of a TIFF (libtiff's `LZMA`, written by GDAL), for the
# viewer's `decode_any` only; the LZMA2 decoder that exav-unpack uses, same version.
lzma-rust2 = { version = "0.23", default-features = false, features = ["std"], optional = true }
# JPEG 2000, JBIG2 and CCITT fax, which libclamav does not decode.
# `forbid(unsafe_code)` crates, built without `simd` (fearless_simd, whose
# intrinsics are `unsafe`) and `image` (the `image` and moxcms integration).
# hayro-ccitt is hayro-jbig2's own MMR decoder.
# BC1 to BC7 blocks for the viewer's DDS fallback (`decode_any`): safe, no
# dependencies, MIT.
bcdec_rs = { version = "=0.2.0", optional = true }
hayro-jpeg2000 = { version = "=0.4.1", default-features = false, features = ["std"], optional = true }
hayro-jbig2 = { version = "=0.3.1", default-features = false, features = ["std"], optional = true }
hayro-ccitt = { version = "=0.4.0", optional = true }
# JPEG XL: zenjxl-decoder, a fork of the libjxl team's jxl-rs that is
# `#![forbid(unsafe_code)]` unless its `allow-unsafe` feature is on, with
# limits on pixels and memory. Built without its SIMD (the default
# `all-simd`) and without `threads`; no CMS, no JPEG reconstruction.
zenjxl-decoder = { version = "=0.3.10", default-features = false, optional = true }
# DXF's pairs, records and code pages, and DWG's bit codes, sections and
# objects, which the drawing model (`cad`) is read from; those formats
# alone, none of the scanner's others.
exav-unpack = { path = "../exav-unpack", version = "0.0.2", default-features = false, features = ["dxf", "dwg"], optional = true }
# Markdown: CommonMark with tables and strikethrough, read as events. Without
# its `html` and `simd` features: no markup is made, and its only `unsafe`
# (the SIMD scanners) is off.
pulldown-cmark = { version = "=0.13.4", default-features = false, optional = true }
# The office converters (`office-*`): packages are read, and the XLSX, PPTX
# and DOCX written, as ZIP.
zip = { version = "9", default-features = false, features = ["deflate-flate2"], optional = true }
# ODF's XML. 0.41 bounds namespace declarations per element and checks
# duplicate attributes in linear time (RUSTSEC-2026-0194, -0195).
quick-xml = { version = "0.42", optional = true }
# Text in Windows and Mac code pages; the DOS ones are tables of our own.
encoding_rs = { version = "0.8.42", default-features = false, features = ["alloc"], optional = true }
# XLS decryption with the default password ([MS-OFFCRYPTO] RC4, RC4 CryptoAPI).
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }

[features]
default = ["image", "webp", "ico", "pnm", "qoi", "dds", "ff", "hdr", "jp2", "jbig2", "ccitt", "raw"]
# Raster images: PNG, GIF, JPEG, TIFF and BMP, plus the formats below.
image = [
    "dep:image", "dep:png", "dep:gif", "dep:zune-jpeg", "dep:zune-core", "dep:zune-core-04",
    "dep:zune-jpeg-04", "dep:fax34", "dep:flate2", "dep:quick-error", "dep:weezl",
    "dep:bytemuck", "dep:ruzstd", "dep:lzma-rust2",
]
# Each is a decoder without `unsafe`: image-webp and qoi are
# `forbid(unsafe_code)`, the others are `image`'s own. OpenEXR is left out: its
# crate pulls `rayon-core` and `smallvec`.
webp = ["image", "image/webp"]
ico = ["image", "image/ico"]
pnm = ["image", "image/pnm"]
qoi = ["image", "image/qoi"]
dds = ["image", "image/dds", "dep:bcdec_rs"]
ff = ["image", "image/ff"]
hdr = ["image", "image/hdr"]
# JPEG 2000: with `image`, a JP2 or JPX file or a raw codestream (.j2k,
# .j2c); and a PDF's JPXDecode streams (`pdf_image`).
jp2 = ["dep:hayro-jpeg2000"]
# JBIG2: with `image`, a single-page JBIG2 file; and a PDF's JBIG2Decode
# streams (`pdf_image`).
jbig2 = ["dep:hayro-jbig2"]
# A PDF's CCITTFaxDecode streams (`pdf_image`).
ccitt = ["dep:hayro-ccitt"]
# Camera RAW files (DNG, CR2, CR3, NEF, ARW, ORF, RW2, RAF, PEF, SRW, 3FR,
# IIQ, X3F...), shown by the largest JPEG or RGB preview they embed
# (`image::raw`). The sensor data is not decoded.
raw = ["image"]
# JPEG XL, first frame, as 8-bit grey or RGBA. Not a default: libclamav does
# not decode it, so the scanner's image hash has no use for it, and it is the
# largest decoder here.
jxl = ["image", "dep:zenjxl-decoder"]
# DXF (R12 to 2018) and DWG (R13 to 2018) into the drawing model
# (`cad`), tessellated for a GPU.
dwg = ["dep:exav-unpack"]
# Print what each layout viewport emitted and what it clipped against.
vp-debug = ["dwg"]
# IFC (IFC2X3, IFC4, IFC4X3) models into triangle meshes (`ifc`, `mesh`).
ifc = []
# Binary and ASCII STL into the same meshes (`stl`, `mesh`).
stl = []
# Wavefront OBJ (`obj`), Stanford PLY (`ply`) and glTF 2.0 with GLB (`gltf`,
# with a JSON reader of its own) into the same meshes.
obj = []
ply = []
gltf = []
# Markdown into a tree of blocks and inlines (`markdown`), as data: no HTML
# is ever made.
markdown = ["dep:pulldown-cmark"]
# The text of a document as a reader sees it, one entry for every kind that has
# some (`text`): Markdown, HTML, Office and OpenDocument XML parts, PDF (hayro)
# and drawings. For a scanner or a search; the viewer does not use it.
text = ["markdown", "dwg", "exav-unpack/text"]
# And PDF's, read by hayro: the largest part of `text`.
text-pdf = ["text", "exav-unpack/text-pdf"]
# And the office formats' the XML parts do not reach, from what `office`
# reads: DOC, XLS, PPT, RTF, Word 2003 XML, SpreadsheetML 2003, SYLK, flat
# OpenDocument, Numbers, Pages, Keynote.
text-office = ["text", "office"]
# What every office converter shares (`formats::office::common`): ZIP
# packages, ODF's XML, code pages. Not a feature to ask for.
_office = ["dep:zip", "dep:flate2", "dep:quick-xml", "dep:encoding_rs"]
# Spreadsheets into XLSX (`sheets`): Excel 2 to 2003, ODS, FODS, OTS, Apple
# Numbers, XML Spreadsheet 2003, HTML tables and SYLK. Also the chart writer
# the presentations use for ODF charts.
office-sheets = ["_office", "dep:md-5", "dep:sha1"]
# Presentations into PPTX (`slides`): PowerPoint 95 and 97 to 2003, ODP, FODP,
# OTP and Apple Keynote; drawings: ODG, OTG, FODG and Visio (VSDX).
office-slides = ["_office", "dep:md-5", "dep:sha1"]
# Text documents into DOCX (`docs`): Word 6 to 2003, ODT, FODT, OTT, RTF,
# Word 2003 XML, Apple Pages and HTML pages (Word's "Save as Web Page"), which
# are read with the HTML tokenizer and style sheets of `sheets`.
office-docs = ["_office", "office-sheets"]
# Every office converter.
office = ["office-sheets", "office-slides", "office-docs"]
# Writers of compound files, protobuf messages and Snappy blocks, for the
# tests that build the documents they read. Not a feature to ask for.
office-test-util = ["_office"]

[dev-dependencies]
serde_json = "1"
# The strict compound file reader the lenient one of `office` is checked against.
cfb = "0.15.0"
# The drawing fixtures are gzipped.
flate2 = "1.1.10"
# The DWG oracle test names local corpus files by hash.
sha2 = "0.11"

