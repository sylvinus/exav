<body>
<table x:str border=0 cellpadding=0 cellspacing=0>
 <col width=128 style='width:96pt'>
 <col width=96 span=2 style='width:72pt'>
 <tr height=17 style='height:12.75pt'>
  <td class=xl65>Item</td>
  <td class=xl65>Amount</td>
  <td class=xl65>Date</td>
 </tr>
 <tr height=17 style='height:12.75pt'>
  <td>Rent</td>
  <td class=xl66 align=right x:num="1200">1,200.00</td>
  <td class=xl67 align=right x:num="45297">2024-01-06</td>
 </tr>
 <tr height=17 style='height:12.75pt'>
  <td>Food</td>

 </tr>

  <td class=xl66 align=right x:num="89.99">89.99</td>
  <td></td>
 </tr>
 <tr height=17 style='height:12.75pt'>
  <td>Total</td>
  <td class=xl66 align=right x:num="1635.49" x:fmla="=SUM(B2:B4)">1,635.49</td>
  <td></td>
 </tr>
 <tr height=17 style='height:12.75pt'>
  <td colspan=3 style='mso-ignore:colspan'></td>
 </tr>
