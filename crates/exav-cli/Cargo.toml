[package]
name = "exav-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"
description = "Command-line interface and scanning daemon for the exav malware scanner (clamscan-compatible)."

[[bin]]
name = "exav"
path = "src/main.rs"

[features]
default = ["yara", "all-formats", "decrypt", "dlp", "icap"]
# ICAP (RFC 3507) server, so exav can stand in for a `c-icap` container at a
# proxy's adaptation hook. ON by default — pure-Rust, std-only, no extra crates
# — because the published image has to be able to serve it. It still binds
# nothing unless `--icap` asks it to.
icap = []
# Full YARA rule matching via the native engine in exav-core. ON by default —
# pure-Rust, no runtime codegen. Disable with `--no-default-features` for a
# smaller build (~13 fewer crates: drops the YARA parser + regex-automata).
yara = ["exav-core/yara"]
# Lets a scanned file ask a decoder to panic, abort or exhaust the stack, so the
# tests can check what the CLI reports when one does. A crash that a caller
# cannot tell from a clean scan is the worst outcome exav has, and that is only
# observable from outside the process. Never enabled by a shipped build.
testing-faults = ["exav-core/testing-faults"]
# HTTP(S) support. OFF by default so the standard build is 100% pure-Rust and
# links no TLS stack — `ureq → rustls → ring` is the only C/asm in the tree.
# Split into two independently-selectable halves so a deployment can take the
# signature updater WITHOUT exposing the network-facing scan verb (or vice versa):
#
#   * `http-scan`   — scan an `http(s)://` argument + the daemon `SCANURL` command.
#                     This lets a daemon *client* make the daemon fetch a URL, so
#                     leave it off on an updater-only or untrusted-client daemon.
#   * `http-update` — what `--auto-update` fetches with: `--sig-sources` (exact
#                     URLs, CVD mirror bases, or a file of either) and `--db-url`
#                     (pull a prebuilt `.exavdb`). Pulls the `exav-update` crate.
#
# `http` enables both (unchanged meaning; the published image builds with it).
http = ["http-scan", "http-update"]
http-scan = ["exav-core/http"]
http-update = ["dep:exav-update"]
checksums = ["exav-core/checksums"]
# DLP structured-data heuristic (credit-card / SSN counting). Enables the
# `--structured-cc-count` / `--structured-ssn-count` flags. Tiny, pure-Rust.
dlp = ["exav-core/dlp"]
decrypt = ["exav-core/decrypt"]

# Archive/container formats, forwarded to exav-core → exav-unpack. `all-formats`
# (in `default`) is every extractor; pick individual formats for a smaller
# binary (e.g. `--no-default-features --features yara,zip`).
all-formats = ["exav-core/all-formats"]
zip = ["exav-core/zip"]
gzip = ["exav-core/gzip"]
tar = ["exav-core/tar"]
bzip2 = ["exav-core/bzip2"]
xz = ["exav-core/xz"]
zstd = ["exav-core/zstd"]
lzip = ["exav-core/lzip"]
cab = ["exav-core/cab"]
chm = ["exav-core/chm"]
sevenz = ["exav-core/sevenz"]
rar = ["exav-core/rar"]
arj = ["exav-core/arj"]
lha = ["exav-core/lha"]
iso = ["exav-core/iso"]
ole = ["exav-core/ole"]
pdf = ["exav-core/pdf"]
email = ["exav-core/email"]
dmg = ["exav-core/dmg"]
upx = ["exav-core/upx"]
ar = ["exav-core/ar"]
cpio = ["exav-core/cpio"]
xar = ["exav-core/xar"]
uuencode = ["exav-core/uuencode"]
xdp = ["exav-core/xdp"]
szdd = ["exav-core/szdd"]
tnef = ["exav-core/tnef"]
swf = ["exav-core/swf"]
binhex = ["exav-core/binhex"]
lnk = ["exav-core/lnk"]
partition = ["exav-core/partition"]
vhd = ["exav-core/vhd"]
lzw = ["exav-core/lzw"]
diskimage = ["exav-core/diskimage"]
wim = ["exav-core/wim"]
lz4 = ["exav-core/lz4"]
arc = ["exav-core/arc"]
ace = ["exav-core/ace"]
fat = ["exav-core/fat"]
inno = ["exav-core/inno"]
ntfs = ["exav-core/ntfs"]
pyc = ["exav-core/pyc"]
nsis = ["exav-core/nsis"]
autoit = ["exav-core/autoit"]
onenote = ["exav-core/onenote"]
rtf = ["exav-core/rtf"]
machofat = ["exav-core/machofat"]
sfx = ["exav-core/sfx"]

[dependencies]
exav-core = { path = "../exav-core", version = "0.1.0", default-features = false }
# Standalone signature updater (its own TLS stack), enabled by the `http`
# feature so the default pure-Rust build never links it.
exav-update = { path = "../exav-update", version = "0.1.0", optional = true }
clap.workspace = true
anyhow.workspace = true
walkdir.workspace = true
libc = "0.2.186"
regex = "1.12.4"
# Machine-readable `--json` output.
serde_json = "1"
# Spilling large INSTREAM/EXINSTREAM payloads to a temp file is `src/tmpfile.rs`,
# deliberately not a dependency: the ready-made crates reach it through `rustix`
# + `linux-raw-sys`, thousands of unsafe blocks for a feature that never touches
# a scanned byte.

[dev-dependencies]

# `.deb` packaging via cargo-deb (https://github.com/kornelski/cargo-deb):
#   cargo build --release -p exav-cli && cargo deb -p exav-cli --no-build
# Produces a Debian package that installs the `exav` binary and the optional
# clamd-compatible systemd unit (disabled by default).
[package.metadata.deb]
name = "exav"
maintainer = "exav contributors <https://github.com/sylvinus/exav>"
copyright = "The exav authors, MIT"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
A drop-in, memory-safe ClamAV replacement written in Rust: a clamscan-compatible \
CLI and a clamd-compatible scanning daemon that load ClamAV's own signature \
databases, with no file-size limit and constant-memory streaming."""
assets = [
    ["target/release/exav", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/exav/README.md", "644"],
    ["../../NOTICE", "usr/share/doc/exav/NOTICE", "644"],
    ["../../packaging/exav-clamd.service", "lib/systemd/system/exav-clamd.service", "644"],
]


# docs.rs builds with every feature on, so the parts gated behind a feature
# (in particular exav-core's `unstable-internals`) appear on the rendered page
# instead of silently missing from it.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
