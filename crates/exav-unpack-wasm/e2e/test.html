<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>wasm test runner</title></head>
<body>
<pre id="output"></pre>
<script type="module">
  // The facade, not the raw wasm module: the facade is what a page imports,
  // and it is what decides whether an archive goes through a Worker.
  import init, { Archive, unpack, detectFormat, joinVolumes, isVolumePart } from "/js/index.js";

  window.__test = {
    Archive, unpack, detectFormat, joinVolumes, isVolumePart,
    ready: (async () => { await init(); return true; })(),
  };
</script>
</body>
</html>
