[package]
name = "exav-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# default-features off: the fuzz targets exercise the scan/unpack pipeline, not
# the yara-x integration (which pulls the heavy wasmtime/cranelift tree and has
# its own fuzz suite). Keeps the ASan build tractable on a single core.
# `unstable-internals` re-exposes the engine internals (engine/bytecode/pe/
# patterns/hashes/…) that several targets fuzz directly — those modules are
# crate-private in the default build. `all-formats` fuzzes every extractor
# (the `unpack`/`analyze`/`full_pipeline` targets rely on it).
# `decrypt` is enabled so the decryption code paths (ZipCrypto/WinZip-AES, 7z
# AES, PDF/DMG crypto) are compiled in and fuzzed, not skipped.
exav-core = { path = "../crates/exav-core", default-features = false, features = ["unstable-internals", "all-formats", "decrypt", "dlp", "phishing"] }
exav-unpack = { path = "../crates/exav-unpack", default-features = false, features = ["all-formats", "decrypt"] }
# The x86 emulator, fuzzed directly: it is the only component where the scanned
# file supplies control flow rather than data, and the only path from those bytes
# to a dependency that contains `unsafe` (the instruction decoder).
exav-pe-emu = { path = "../crates/exav-pe-emu" }
# The instruction decoder, fuzzed differentially against `iced-x86`. Bytes from
# a scanned file reach it directly, and a decoder that gets a length wrong
# desynchronises everything after it — so the oracle is compiled in here, and
# only here.
exav-x86 = { path = "../crates/exav-x86" }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder"] }

[[bin]]
name = "analyze"
path = "fuzz_targets/analyze.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unpack"
path = "fuzz_targets/unpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pe_emulator"
path = "fuzz_targets/pe_emulator.rs"
test = false
doc = false
bench = false

[[bin]]
name = "x86_decode"
path = "fuzz_targets/x86_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cvd"
path = "fuzz_targets/cvd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pe"
path = "fuzz_targets/pe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filetype"
path = "fuzz_targets/filetype.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sigs"
path = "fuzz_targets/sigs.rs"
test = false
doc = false
bench = false

# Keep fuzz binaries debuggable while optimized.
[profile.release]
debug = 1

# `exav-core` is the memory peak of the whole build. cargo-fuzz forces
# `codegen-units=1` and full ASan instrumentation through RUSTFLAGS, and on a
# small host rustc is killed part way through compiling it — which reads in the
# log exactly like a target that ran and found nothing. Compiling this one crate
# at a lower optimisation level keeps the peak inside a few gigabytes. It is the
# harness that gets slower, not the coverage: the instrumentation, the seeds and
# the assertions are unchanged.
[profile.release.package.exav-core]
opt-level = 1

[workspace]

[[bin]]
name = "bytecode"
path = "fuzz_targets/bytecode.rs"
test = false

[[bin]]
name = "rar3_ppmd"
path = "fuzz_targets/rar3_ppmd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ndb_compile"
path = "fuzz_targets/ndb_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "full_pipeline"
path = "fuzz_targets/full_pipeline.rs"
test = false
doc = false
bench = false

# Nesting depth, which the byte-mutating targets do not reach: every extra level
# needs another well-formed delimiter pair, so random mutation stalls at two or
# three. This one constructs the depth instead.
[[bin]]
name = "parser_recursion"
path = "fuzz_targets/parser_recursion.rs"
test = false
doc = false
bench = false
