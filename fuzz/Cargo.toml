[package]
name = "exav-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Structured inputs for the targets that write a protocol (clamd, ICAP).
arbitrary = { version = "1", features = ["derive"] }
# The custom mutator and the input framing, in a crate of their own so that
# their tests run without this one's sanitizer build.
exav-fuzz-support = { path = "support" }
# Default features off, then what the scanner ships with that matters here: the
# `yara` feature is the native in-tree engine (no wasmtime), and the targets
# that scan with `fuzz/db/` and that load signature files reach it. Without it
# a `.yar` file is stored and never matched.
# `unstable-internals` re-exposes the engine internals (engine/bytecode/pe/
# patterns/hashes/...) that several targets fuzz directly: those modules are
# crate-private in the default build. `all-formats` fuzzes every extractor
# (the `unpack`/`analyze`/`full_pipeline` targets rely on it).
# `decrypt` is enabled so the decryption code paths (ZipCrypto/WinZip-AES, 7z
# AES, PDF/DMG crypto) are compiled in and fuzzed, not skipped.
# `checksums` verifies the archives' own CRCs, a path the default scan skips.
# `image-hash` is `fuzzy_img#` subsignatures. `visible-text` (and `-pdf`) is a
# document's text view.
exav-core = { path = "../crates/exav-core", default-features = false, features = ["unstable-internals", "all-formats", "decrypt", "dlp", "phishing", "yara", "image-hash", "visible-text", "visible-text-pdf", "visible-text-office", "checksums"] }
exav-unpack = { path = "../crates/exav-unpack", default-features = false, features = ["all-formats", "decrypt", "checksums"] }
# The clamd and ICAP parsers, over memory (`exav_cli::fuzzing`): the source of
# the `exav` binary built as a library, which `exav` itself does not ship.
exav-cli = { path = "exav-cli" }
# The x86 emulator, fuzzed directly: it is the only component where the scanned
# file supplies control flow rather than data.
exav-pe-emu = { path = "../crates/exav-pe-emu" }
# The instruction decoder, fuzzed differentially against `iced-x86`. Bytes from
# a scanned file reach it directly, and a decoder that gets a length wrong
# desynchronises everything after it: so the oracle is compiled in here, and
# only here.
exav-x86 = { path = "../crates/exav-x86" }
# The image decoders behind `fuzzy_img#`, every format, fuzzed directly: the
# scan reaches them only when a database has such a signature.
exav-imagehash = { path = "../crates/exav-imagehash", default-features = false, features = ["webp", "ico", "pnm", "qoi", "dds", "ff", "hdr", "jp2", "jbig2"] }
# DWG and DXF, which @exav/viewer parses in the browser from whatever a user
# opens; the scanner does not read them. Its PDF image decoders too (the
# `imagehash` target), which the viewer runs in place of pdf.js's own.
#
# The office converters too (`office`): XLS, ODS and Numbers to XLSX, PPT, ODP
# and Keynote to PPTX, DOC, ODT, RTF, Word 2003 XML and Pages to DOCX, which
# @exav/viewer converts in the browser from whatever a user opens; the
# scanner does not read them this way. `office-test-util` is the compound file
# writer the PPT and DOC targets store their input with.
exav-render = { path = "../crates/exav-render", default-features = false, features = ["dwg", "image", "raw", "jp2", "jbig2", "ccitt", "jxl", "ifc", "stl", "obj", "ply", "gltf", "markdown", "text-pdf", "text-office", "office", "office-test-util"] }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder"] }
# `zip` wraps the Numbers target's input and reads the XLSX back.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Keep fuzz binaries debuggable while optimized.
[profile.release]
debug = 1

# `exav-core` is the memory peak of the whole build. cargo-fuzz forces
# `codegen-units=1` and full ASan instrumentation through RUSTFLAGS, and on a
# small host rustc is killed part way through compiling it, which reads in the
# log exactly like a target that ran and found nothing. Compiling this one crate
# at a lower optimisation level keeps the peak inside a few gigabytes. It is the
# harness that gets slower, not the coverage: the instrumentation, the seeds and
# the assertions are unchanged.
[profile.release.package.exav-core]
opt-level = 1

[workspace]
members = ["support", "exav-cli"]

# Every target is a `fuzz_targets/<name>.rs`. `test = false` because a fuzz
# target has no unit tests to run; `doc` and `bench` off for the same reason.

[[bin]]
name = "analyze"
path = "fuzz_targets/analyze.rs"
test = false
doc = false
bench = false

