[package]
name = "exav-cli"
version = "0.0.0"
publish = false
edition = "2021"
description = "crates/exav's src/main.rs built as a library, for the fuzz targets that drive the clamd and ICAP parsers. Not published: `exav` itself ships no library."

# The same file the `exav` binary is built from, so what is fuzzed is what
# ships. Its `crate::` paths and its modules (`daemon.rs`, `icap/`, ...) resolve
# as they do there. `fn main` is unused here.
[lib]
name = "exav_cli"
path = "../../crates/exav/src/main.rs"
doc = false
test = false

# `fuzzing` adds `exav_cli::fuzzing` (src/fuzzing.rs) and makes the clamd verbs
# that take a path answer an error. `icap` is the ICAP server.
[features]
default = ["icap", "fuzzing"]
fuzzing = []
icap = []
# Declared so the source's `cfg`s name known features; never on (no TLS stack).
http-scan = []
http-update = []

# What crates/exav/Cargo.toml depends on, with the versions its workspace gives
# `clap` and `walkdir`. Keep them in step: a dependency added there and not
# here fails this crate's build, which is how it is noticed.
[dependencies]
exav-core = { path = "../../crates/exav-core", default-features = false }
clap = { version = "4.6", features = ["derive", "env"] }
walkdir = "2.5"
libc = "0.2.191"
regex = "1.13.1"
serde_json = "1"

[lints.rust]
dead_code = "allow"
unused = "allow"
